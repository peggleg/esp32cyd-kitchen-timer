esphome:
  name: kitchen-timer
  friendly_name: Kitchen Timer
  on_boot:
    priority: -100
    then:
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_21);
          gpio_deep_sleep_hold_dis();
      - script.execute: refresh_select

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Kitchen-Timer-Fallback"
    password: "12345678"

ota:
  - platform: esphome
    password: !secret ota

time:
  - platform: homeassistant
    id: homeassistant_time

# SPI Configuration - CYD uses TWO separate buses
spi:
  - id: tft_bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_bus
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

deep_sleep:
  id: deep_sleep_1
  wakeup_pin:
    number: GPIO36
    allow_other_uses: true
    inverted: true      # XPT2046 IRQ pulls LOW on touch, wake on that level
  wakeup_pin_mode: KEEP_AWAKE

# ---------------------------------------------------------------- state
globals:
  - id: sel_seconds        # currently selected duration
    type: int
    restore_value: no
    initial_value: '0'
  - id: custom_from_running   # true when keypad was opened mid-countdown
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: remaining
    type: int
    restore_value: no
    initial_value: '0'
  - id: total
    type: int
    restore_value: no
    initial_value: '0'
  - id: paused
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: alarm_active       # true from timer finishing until the screen is tapped
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: alarm_secs         # how long the alarm has been unacknowledged
    type: int
    restore_value: no
    initial_value: '0'
  - id: kbuf               # keypad digit buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: unit_idx           # 0=SEC 1=MIN 2=HRS
    type: int
    restore_value: no
    initial_value: '1'
  - id: idle_secs
    type: int
    restore_value: no
    initial_value: '0'
  - id: safe_to_sleep
    type: bool
    restore_value: no
    initial_value: 'false'

# ---------------------------------------------------------------- fonts
font:
  - file: "gfonts://Roboto@700"
    id: f10
    size: 10
    bpp: 4
  - file: "gfonts://Roboto@700"
    id: f12
    size: 12
    bpp: 4
  - file: "gfonts://Roboto@700"
    id: f16
    size: 16
    bpp: 4
  - file: "gfonts://Roboto@700"
    id: f26
    size: 26
    bpp: 4
  - file: "gfonts://Roboto@700"
    id: f34
    size: 34
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@700"
    id: f38
    size: 38
    bpp: 4
    glyphs: "0123456789:h"

# ---------------------------------------------------------------- display
display:
  - platform: ili9xxx
    model: st7789v
    spi_id: tft_bus
    data_rate: 20MHz
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    id: my_display
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------- touch
touchscreen:
  - platform: xpt2046
    spi_id: touch_bus
    id: my_touchscreen
    cs_pin: GPIO33
    interrupt_pin:
      number: GPIO36
      allow_other_uses: true
    calibration:
      x_min: 428
      x_max: 3538
      y_min: 193
      y_max: 3671
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

# ---------------------------------------------------------------- backlight
output:
  - platform: gpio
    pin: GPIO26
    id: buzzer_output
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    restore_mode: ALWAYS_ON
    id: backlight_light

# ---------------------------------------------------------------- UI
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  rotation: 270
  buffer_size: 25%
  bg_color: 0xF8F5EC
  text_color: 0x23211C
  border_width: 0
  pad_all: 0

  pages:
    # ============================================ SELECT
    - id: page_select
      widgets:
        - label:
            x: 10
            y: 8
            text: "KITCHEN TIMER"
            text_font: f10
            text_color: 0x57554F
        - obj:
            x: 268
            y: 11
            width: 6
            height: 6
            radius: 3
            bg_color: 0x3AA85B
            border_width: 0
        - label:
            x: 279
            y: 8
            text: "HA"
            text_font: f10
            text_color: 0x57554F

        - label:
            id: lbl_dial
            x: 0
            y: 51
            width: 320
            text: "00:00"
            text_font: f38
            text_align: CENTER
        - label:
            x: 0
            y: 97
            width: 320
            text: "TAP TO CLEAR"
            text_font: f12
            text_color: 0x57554F
            text_align: CENTER
        - button:
            x: 40
            y: 40
            width: 240
            height: 90
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_press:
              - lambda: 'id(sel_seconds) = 0;'
              - script.execute: refresh_select

        - button:
            id: p1
            x: 10
            y: 138
            width: 53
            height: 44
            radius: 10
            bg_color: 0xE0DED7
            on_press:
              - lambda: 'id(sel_seconds) = min(id(sel_seconds) + 60, 43200);'
              - script.execute: refresh_select
            widgets:
              - label:
                  id: p1t
                  align: CENTER
                  text: "+1m"
                  text_font: f12
                  text_color: 0x302E28
        - button:
            id: p2
            x: 68
            y: 138
            width: 53
            height: 44
            radius: 10
            bg_color: 0xE0DED7
            on_press:
              - lambda: 'id(sel_seconds) = min(id(sel_seconds) + 600, 43200);'
              - script.execute: refresh_select
            widgets:
              - label:
                  id: p2t
                  align: CENTER
                  text: "+10m"
                  text_font: f12
                  text_color: 0x302E28
        - button:
            id: p3
            x: 126
            y: 138
            width: 53
            height: 44
            radius: 10
            bg_color: 0xE0DED7
            on_press:
              - lambda: 'id(sel_seconds) = min(id(sel_seconds) + 1800, 43200);'
              - script.execute: refresh_select
            widgets:
              - label:
                  id: p3t
                  align: CENTER
                  text: "+30m"
                  text_font: f12
                  text_color: 0x302E28
        - button:
            id: p4
            x: 184
            y: 138
            width: 53
            height: 44
            radius: 10
            bg_color: 0xE0DED7
            on_press:
              - lambda: 'id(sel_seconds) = min(id(sel_seconds) + 3600, 43200);'
              - script.execute: refresh_select
            widgets:
              - label:
                  id: p4t
                  align: CENTER
                  text: "+1h"
                  text_font: f12
                  text_color: 0x302E28
        - button:
            id: p_custom
            x: 242
            y: 138
            width: 68
            height: 44
            radius: 10
            bg_color: 0x00ABA3
            on_press:
              - lambda: 'id(kbuf) = ""; id(unit_idx) = 1; id(custom_from_running) = false;'
              - script.execute: refresh_custom
              - lvgl.page.show: page_custom
            widgets:
              - label:
                  align: CENTER
                  text: "Custom"
                  text_font: f12
                  text_color: 0xFFFFFF

        - button:
            x: 10
            y: 188
            width: 300
            height: 44
            radius: 10
            bg_color: 0x23211C
            on_press:
              - lambda: |-
                  if (id(sel_seconds) > 0) {
                    id(total) = id(sel_seconds);
                    id(remaining) = id(sel_seconds);
                    id(running) = true;
                    id(paused) = false;
                  }
              - if:
                  condition:
                    lambda: 'return id(running);'
                  then:
                    - script.execute: refresh_running
                    - lvgl.page.show: page_running
            widgets:
              - label:
                  align: CENTER
                  text: "START"
                  text_font: f16
                  text_color: 0xFFFFFF

    # ============================================ CUSTOM
    - id: page_custom
      widgets:
        - button:
            x: 0
            y: 0
            width: 72
            height: 34
            radius: 7
            bg_color: 0xE0DED7
            on_press:
              - if:
                  condition:
                    lambda: 'return id(custom_from_running);'
                  then:
                    - lvgl.page.show: page_running
                  else:
                    - lvgl.page.show: page_select
            widgets:
              - label:
                  align: CENTER
                  text: "BACK"
                  text_font: f10
                  text_color: 0x2B2923
        - label:
            id: lbl_custom_title
            x: 82
            y: 11
            text: "CUSTOM TIME"
            text_font: f10
            text_color: 0x57554F

        - label:
            id: lbl_buf
            x: 90
            y: 36
            width: 90
            text: "0"
            text_font: f34
            text_align: RIGHT
        - button:
            id: btn_unit
            x: 190
            y: 42
            width: 44
            height: 22
            radius: 11
            bg_color: 0x00ABA3
            on_press:
              - lambda: 'id(unit_idx) = (id(unit_idx) + 1) % 3;'
              - script.execute: refresh_custom
            widgets:
              - label:
                  id: lbl_unit
                  align: CENTER
                  text: "MIN"
                  text_font: f12
                  text_color: 0xFFFFFF

        - button:
            x: 10
            y: 74
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "1";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "1", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 111
            y: 74
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "2";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "2", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 213
            y: 74
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "3";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "3", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 10
            y: 115
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "4";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "4", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 111
            y: 115
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "5";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "5", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 213
            y: 115
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "6";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "6", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 10
            y: 155
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "7";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "7", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 111
            y: 155
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "8";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "8", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 213
            y: 155
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "9";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "9", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 10
            y: 196
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (!id(kbuf).empty()) id(kbuf).erase(id(kbuf).size() - 1);'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "DEL", text_font: f12, text_color: 0x2B2923 }
        - button:
            x: 111
            y: 196
            width: 97
            height: 36
            radius: 8
            bg_color: 0xE3E1DB
            on_press:
              - lambda: 'if (id(kbuf).size() < 3) id(kbuf) += "0";'
              - script.execute: refresh_custom
            widgets:
              - label: { align: CENTER, text: "0", text_font: f16, text_color: 0x2B2923 }
        - button:
            x: 213
            y: 196
            width: 97
            height: 36
            radius: 8
            bg_color: 0x00ABA3
            on_press:
              - lambda: |-
                  int n = id(kbuf).empty() ? 0 : atoi(id(kbuf).c_str());
                  if (n > 0) {
                    int mult = (id(unit_idx) == 0) ? 1 : (id(unit_idx) == 1) ? 60 : 3600;
                    int secs = n * mult;
                    if (secs > 43200) secs = 43200;
                    if (id(custom_from_running)) {
                      id(remaining) += secs;
                      id(total) += secs;
                    } else {
                      id(sel_seconds) = secs;
                    }
                  }
              - if:
                  condition:
                    lambda: 'return id(custom_from_running);'
                  then:
                    - script.execute: refresh_running
                    - lvgl.page.show: page_running
                  else:
                    - script.execute: refresh_select
                    - lvgl.page.show: page_select
            widgets:
              - label: { align: CENTER, text: "OK", text_font: f16, text_color: 0xFFFFFF }

    # ============================================ RUNNING
    - id: page_running
      widgets:
        - label:
            id: lbl_status
            x: 10
            y: 8
            text: "RUNNING"
            text_font: f10
            text_color: 0x57554F
        - obj:
            x: 268
            y: 11
            width: 6
            height: 6
            radius: 3
            bg_color: 0x3AA85B
            border_width: 0
        - label:
            x: 279
            y: 8
            text: "HA"
            text_font: f10
            text_color: 0x57554F

        - label:
            id: lbl_count
            x: 0
            y: 79
            width: 320
            text: "00:00"
            text_font: f38
            text_align: CENTER
        - bar:
            id: prog
            x: 20
            y: 124
            width: 280
            height: 8
            radius: 4
            min_value: 0
            max_value: 100
            value: 100
            bg_color: 0xE0DED7
            indicator:
              bg_color: 0xEF6856
              radius: 4

        - button:
            x: 10
            y: 190
            width: 56
            height: 46
            radius: 9
            bg_color: 0xE0DED7
            on_press:
              - lambda: 'id(paused) = !id(paused);'
              - script.execute: refresh_running
            widgets:
              - label:
                  id: lbl_pause
                  align: CENTER
                  text: "PAUSE"
                  text_font: f10
                  text_color: 0x2B2923
        - button:
            x: 71
            y: 190
            width: 56
            height: 46
            radius: 9
            bg_color: 0x00ABA3
            on_press:
              - lambda: 'id(remaining) += 60; id(total) += 60;'
              - script.execute: refresh_running
            widgets:
              - label:
                  align: CENTER
                  text: "+1 MIN"
                  text_font: f10
                  text_color: 0xFFFFFF
        - button:
            x: 132
            y: 190
            width: 56
            height: 46
            radius: 9
            bg_color: 0x00ABA3
            on_press:
              - lambda: 'id(remaining) += 300; id(total) += 300;'
              - script.execute: refresh_running
            widgets:
              - label:
                  align: CENTER
                  text: "+5 MIN"
                  text_font: f10
                  text_color: 0xFFFFFF
        - button:
            x: 193
            y: 190
            width: 56
            height: 46
            radius: 9
            bg_color: 0xE0DED7
            on_press:
              - lambda: 'id(kbuf) = ""; id(unit_idx) = 1; id(custom_from_running) = true;'
              - script.execute: refresh_custom
              - lvgl.page.show: page_custom
            widgets:
              - label:
                  align: CENTER
                  text: "+CUSTOM"
                  text_font: f10
                  text_color: 0x2B2923
        - button:
            x: 254
            y: 190
            width: 56
            height: 46
            radius: 9
            bg_color: 0xEF6856
            on_press:
              - lambda: 'id(running) = false; id(paused) = false;'
              - lvgl.page.show: page_select
            widgets:
              - label:
                  align: CENTER
                  text: "CANCEL"
                  text_font: f10
                  text_color: 0xFFFFFF

    # ============================================ DONE
    - id: page_done
      bg_color: 0xEF6856
      widgets:
        - button:
            id: done_hit
            x: 0
            y: 0
            width: 320
            height: 240
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_press:
              - lambda: 'id(alarm_active) = false; id(sel_seconds) = 0;'
              - output.turn_off: buzzer_output
              - script.execute: refresh_select
              - lvgl.page.show: page_select
        - label:
            id: lbl_done
            x: 0
            y: 100
            width: 320
            text: "TIME'S UP!"
            text_font: f26
            text_color: 0xFFFFFF
            text_align: CENTER
        - label:
            x: 0
            y: 136
            width: 320
            text: "TAP ANYWHERE TO DISMISS"
            text_font: f10
            text_color: 0x443734
            text_align: CENTER

# ---------------------------------------------------------------- scripts
script:
  - id: refresh_select
    then:
      - lvgl.label.update:
          id: lbl_dial
          text: !lambda |-
            int t = id(sel_seconds);
            char b[12];
            int h = t / 3600, m = (t % 3600) / 60, s = t % 60;
            if (h > 0) snprintf(b, sizeof(b), "%dh%02d", h, m);
            else snprintf(b, sizeof(b), "%02d:%02d", m, s);
            return std::string(b);

  - id: refresh_custom
    then:
      - lvgl.label.update:
          id: lbl_custom_title
          text: !lambda 'return id(custom_from_running) ? std::string("ADD TIME") : std::string("CUSTOM TIME");'
      - lvgl.label.update:
          id: lbl_buf
          text: !lambda 'return id(kbuf).empty() ? std::string("0") : id(kbuf);'
      - lvgl.label.update:
          id: lbl_unit
          text: !lambda |-
            if (id(unit_idx) == 0) return std::string("SEC");
            if (id(unit_idx) == 1) return std::string("MIN");
            return std::string("HRS");

  - id: refresh_running
    then:
      - lvgl.label.update:
          id: lbl_count
          text: !lambda |-
            int t = id(remaining);
            char b[12];
            int h = t / 3600, m = (t % 3600) / 60, s = t % 60;
            if (h > 0) snprintf(b, sizeof(b), "%d:%02d:%02d", h, m, s);
            else snprintf(b, sizeof(b), "%02d:%02d", m, s);
            return std::string(b);
      - lvgl.bar.update:
          id: prog
          value: !lambda 'return id(total) > 0 ? (int)((id(remaining) * 100.0f) / id(total)) : 0;'
      - lvgl.label.update:
          id: lbl_status
          text: !lambda 'return id(paused) ? std::string("PAUSED") : std::string("RUNNING");'
      - lvgl.label.update:
          id: lbl_pause
          text: !lambda 'return id(paused) ? std::string("RESUME") : std::string("PAUSE");'

# ---------------------------------------------------------------- logic
interval:
  # countdown
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(running) && !id(paused) && id(remaining) > 0;'
          then:
            - lambda: 'id(remaining) -= 1;'
            - script.execute: refresh_running
            - if:
                condition:
                  lambda: 'return id(remaining) <= 0;'
                then:
                  - lambda: 'id(running) = false; id(alarm_active) = true;'
                  - output.turn_on: buzzer_output
                  - lvgl.page.show: page_done
                  - delay: 5s
                  - output.turn_off: buzzer_output
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return !id(safe_to_sleep) && millis() > 90000;'
          then:
            - lambda: 'id(safe_to_sleep) = true;'
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(sel_seconds) == 0 && !id(running);'
          then:
            - lambda: 'id(idle_secs) += 10;'
            - if:
                condition:
                  lambda: 'return id(idle_secs) >= 60 && id(safe_to_sleep);'
                then:
                  - light.turn_off: backlight_light
                  - lambda: |-
                      gpio_set_direction(GPIO_NUM_21, GPIO_MODE_OUTPUT);
                      gpio_set_level(GPIO_NUM_21, 0);
                      gpio_hold_en(GPIO_NUM_21);
                      gpio_deep_sleep_hold_en();
                  - delay: 200ms
                  - deep_sleep.enter: deep_sleep_1
          else:
            - lambda: 'id(idle_secs) = 0;'

  # safety: stop nagging after 10 minutes if nobody dismisses it
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(alarm_active);'
          then:
            - lambda: 'id(alarm_secs) += 10; if (id(alarm_secs) >= 600) { id(alarm_active) = false; id(alarm_secs) = 0; }'
          else:
            - lambda: 'id(alarm_secs) = 0;'

  # TIME'S UP! flash
  - interval: 1000ms
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_done
          then:
            - lvgl.widget.update:
                id: page_done
                bg_color: !lambda 'return (millis() / 300) % 2 ? lv_color_hex(0xEF6856) : lv_color_hex(0xF8F5EC);'
            - lvgl.label.update:
                id: lbl_done
                text_color: !lambda 'return (millis() / 300) % 2 ? lv_color_hex(0xFFFFFF) : lv_color_hex(0xEF6856);'

# ---------------------------------------------------------------- HA
sensor:
  - platform: template
    id: timer_remaining_sensor
    name: "Timer Remaining"
    unit_of_measurement: "s"
    device_class: duration
    icon: "mdi:timer"
    lambda: 'return id(remaining);'
    update_interval: 1s

  - platform: adc
    pin: GPIO35
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 3.1277          # (100k + 47k) / 47k
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3
    on_value:
      - sensor.template.publish:
          id: battery_percent
          state: !lambda |-
            float v = x;
            if (std::isnan(v)) return NAN;
            static const float lut[][2] = {
              {3.27f,0},   {3.61f,5},   {3.69f,10},  {3.71f,15}, {3.73f,20},
              {3.75f,25},  {3.77f,30},  {3.79f,35},  {3.80f,40}, {3.82f,45},
              {3.84f,50},  {3.85f,55},  {3.87f,60},  {3.91f,65}, {3.95f,70},
              {3.98f,75},  {4.02f,80},  {4.08f,85},  {4.11f,90}, {4.15f,95},
              {4.20f,100}
            };
            const int n = sizeof(lut) / sizeof(lut[0]);
            if (v <= lut[0][0]) return 0.0f;
            if (v >= lut[n-1][0]) return 100.0f;
            for (int i = 1; i < n; i++) {
              if (v < lut[i][0]) {
                float span = lut[i][0] - lut[i-1][0];
                return lut[i-1][1] + (v - lut[i-1][0]) * (lut[i][1] - lut[i-1][1]) / span;
              }
            }
            return 100.0f;

  - platform: template
    id: battery_percent
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    id: timer_alarm
    name: "Timer Alarm"
    lambda: 'return id(alarm_active);'

  - platform: template
    id: timer_running_sensor
    name: "Timer Running"
    device_class: running
    lambda: 'return id(running) && !id(paused);'

number:
  - platform: template
    id: timer_set_duration
    name: "Timer Duration (seconds)"
    min_value: 0
    max_value: 43200
    step: 1
    unit_of_measurement: "s"
    icon: "mdi:timer"
    optimistic: true
    set_action:
      then:
        - lambda: 'id(sel_seconds) = (int)x;'
        - script.execute: refresh_select

switch:
  - platform: template
    id: timer_running_switch
    name: "Timer Control"
    icon: "mdi:play-pause"
    optimistic: true
    turn_on_action:
      then:
        - lambda: |-
            if (id(sel_seconds) > 0) {
              id(total) = id(sel_seconds);
              id(remaining) = id(sel_seconds);
              id(running) = true;
              id(paused) = false;
            }
        - script.execute: refresh_running
        - lvgl.page.show: page_running
    turn_off_action:
      then:
        - lambda: 'id(paused) = true;'
        - script.execute: refresh_running
    lambda: 'return id(running) && !id(paused);'